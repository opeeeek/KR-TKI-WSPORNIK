name: Program Windows (.exe)
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Znacznik wydania (np. v2.0.0) – puste: bez wydania"
        required: false
        default: ""
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.7"
          cache-dependency-path: app/go.sum
      - run: pip install -r requirements-dev.txt
      - name: Testy (silnik Python + test krzyżowy silnika JS)
        run: python -m pytest -q
      - name: Budowa interfejsu (app/app.html, webapp/wspornik.html)
        run: python build_html.py
      - name: Zasoby Windows (ikona, manifest)
        run: python tools/make_syso.py
      - name: Kompilacja KrotkiWspornikST.exe (Go + WebView2)
        working-directory: app
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags "-H windowsgui -s -w" -o ../dist/KrotkiWspornikST.exe .
      - name: Kontrola pliku .exe
        run: python tools/check_exe.py dist/KrotkiWspornikST.exe
      - name: Wersja przeglądarkowa
        run: cp app/app.html dist/KrotkiWspornikST.html
      - uses: actions/upload-artifact@v4
        with:
          name: KrotkiWspornikST
          path: dist/*
      - name: Wydanie
        if: ${{ inputs.release_tag != '' || startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: Krótki wspornik ST ${{ inputs.release_tag || github.ref_name }}
          body_path: packaging/RELEASE_NOTES.md
          files: |
            dist/KrotkiWspornikST.exe
            dist/KrotkiWspornikST.html
