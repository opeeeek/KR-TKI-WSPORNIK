name: Testy
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Biblioteki systemowe Qt
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libgl1 libfontconfig1 libdbus-1-3 poppler-utils
      - run: pip install -r requirements-dev.txt
      - name: Testy (jednostkowe, walidacyjne, GUI offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
