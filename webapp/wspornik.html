<title>Krótki wspornik ST</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style id="appcss">/* Układ: aplikacja dwupanelowa – dane po lewej, wyniki po prawej; na telefonie przełącznik Dane / Wyniki. */
:root {
  --bg: #eef0f3; --panel: #ffffff; --panel2: #f7f8fa; --line: #d9dde3; --line2: #e8ebef;
  --ink: #1b2230; --ink2: #4a5466; --ink3: #7a8494;
  --acc: #1d5bb8; --acc2: #e8f0fc; --acc3: #0f3f86; --onacc: #ffffff; --focus: #8fb2ea;
  --ok: #1d7f3c; --okbg: #e6f4ea; --warn: #a35d00; --warnbg: #fdf1dc; --fail: #c0262d; --failbg: #fde8e8; --info: #5b6576; --infobg: #eef0f3;
  --errln: #f3c2c4; --wrnln: #f0d6a8; --ubbg: #edf0f3; --ubwarn: #d89a2b;
  --field: #ffffff; --hover: #e3e7ed; --grp: #f2f5f9; --itembg: #fbfcfe; --addln: #a9c3ec; --addhov: #d6e5fb; --dashln: #b9c6da;
  --shadow: rgba(20, 30, 50, .18); --scrim: rgba(15, 22, 35, .45); --toastbg: #1d2636; --toastink: #ffffff;
  --hdr: #172235; --hdr2: #22314b; --hdrln: #34486b; --hdrhov: #24344f; --hdrbot: #0b1220;
  --hdrink: #e9eef6; --hdrink2: #dbe4f2; --hdrmut: #8ea2c2; --hdrtag: #b8c7de; --hdrtagln: #4e6386; --hdrfocus: #5d8fe0;
  --stok: #1f6b3a; --stfail: #a8232a; --stwarn: #8a5300; --onst: #ffffff;
  --brand1: #dfe6f1; --brand2: #9fb3d4; --brand3: #b5413f; --brand4: #172235; --brand5: #3b5b8f;
  --mono: "Cascadia Mono", Consolas, "DejaVu Sans Mono", monospace;
  --ui: "Segoe UI", "Segoe UI Variable", system-ui, -apple-system, "Liberation Sans", Arial, sans-serif;
  --gl: max(16px, env(safe-area-inset-left, 0px)); --gr: max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e131a; --panel: #151b24; --panel2: #1a212c; --line: #2b3443; --line2: #212937;
    --ink: #e4e9f1; --ink2: #b3bccb; --ink3: #8591a3;
    --acc: #4f8ae0; --acc2: #1b2940; --acc3: #9cc0f5; --onacc: #ffffff; --focus: #3f6db5;
    --ok: #4cbf75; --okbg: #13281b; --warn: #e2a33f; --warnbg: #2d2312; --fail: #ef6b6f; --failbg: #2e1618; --info: #9aa5b6; --infobg: #1e2531;
    --errln: #5a2a2d; --wrnln: #5a4420; --ubbg: #262f3d; --ubwarn: #e2a33f;
    --field: #0f141c; --hover: #212a38; --grp: #19212d; --itembg: #121822; --addln: #345283; --addhov: #213454; --dashln: #3a4659;
    --shadow: rgba(0, 0, 0, .5); --scrim: rgba(0, 0, 0, .6); --toastbg: #2b3546; --toastink: #ffffff;
    --hdr: #0a0f17; --hdr2: #151d2b; --hdrln: #2a3954; --hdrhov: #18233a; --hdrbot: #000000;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e131a; --panel: #151b24; --panel2: #1a212c; --line: #2b3443; --line2: #212937;
  --ink: #e4e9f1; --ink2: #b3bccb; --ink3: #8591a3;
  --acc: #4f8ae0; --acc2: #1b2940; --acc3: #9cc0f5; --onacc: #ffffff; --focus: #3f6db5;
  --ok: #4cbf75; --okbg: #13281b; --warn: #e2a33f; --warnbg: #2d2312; --fail: #ef6b6f; --failbg: #2e1618; --info: #9aa5b6; --infobg: #1e2531;
  --errln: #5a2a2d; --wrnln: #5a4420; --ubbg: #262f3d; --ubwarn: #e2a33f;
  --field: #0f141c; --hover: #212a38; --grp: #19212d; --itembg: #121822; --addln: #345283; --addhov: #213454; --dashln: #3a4659;
  --shadow: rgba(0, 0, 0, .5); --scrim: rgba(0, 0, 0, .6); --toastbg: #2b3546; --toastink: #ffffff;
  --hdr: #0a0f17; --hdr2: #151d2b; --hdrln: #2a3954; --hdrhov: #18233a; --hdrbot: #000000;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body { font: 13px/1.4 var(--ui); color: var(--ink); background: var(--bg); overflow: hidden; font-variant-numeric: tabular-nums; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--hdr); }
button { font: inherit; }
sub, sup { font-size: 72%; line-height: 0; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }

/* ---------- pasek górny */
#top { min-height: 50px; display: flex; align-items: center; gap: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0; background: var(--hdr); color: var(--hdrink); border-bottom: 1px solid var(--hdrbot); }
.brand { display: flex; align-items: center; gap: 8px; font-size: 16px; white-space: nowrap; }
.brand b { font-weight: 650; letter-spacing: .2px; }
.brand .tag { font-size: 11px; padding: 1px 6px; border: 1px solid var(--hdrtagln); border-radius: 3px; color: var(--hdrtag); }
#projName { width: 190px; background: var(--hdr2); border: 1px solid var(--hdrln); color: var(--hdrink); padding: 5px 8px; border-radius: 4px; font: inherit; }
#projName:focus { outline: 2px solid var(--hdrfocus); outline-offset: -1px; }
.tb { display: flex; gap: 4px; align-items: center; }
.tb button { background: transparent; color: var(--hdrink2); border: 1px solid transparent; padding: 6px 9px; border-radius: 4px; cursor: pointer; display: flex; gap: 6px; align-items: center; white-space: nowrap; }
.tb button:hover { background: var(--hdrhov); border-color: var(--hdrln); }
.tb button svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.7; flex: none; }
.tb .sep { width: 1px; height: 22px; background: var(--hdrln); margin: 0 4px; }
#status { margin-left: auto; padding: 6px 12px; border-radius: 4px; font-weight: 600; white-space: nowrap; font-size: 13px; color: var(--onst); background: var(--hdr2); }
#status.ok { background: var(--stok); } #status.fail { background: var(--stfail); } #status.warn { background: var(--stwarn); }
#fileName { color: var(--hdrmut); font-size: 12px; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- układ */
main { display: flex; height: calc(100% - 50px); }
#inputs { min-width: 0; columns: 3 330px; column-gap: 14px; }
#inputs details.grp { break-inside: avoid; display: block; margin-bottom: 12px; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--panel); }
.datawrap { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; align-items: start; }
#dataside { position: sticky; top: 0; display: flex; flex-direction: column; gap: 12px; }
#dataside .box { padding: 10px 12px; }
#dataside .schemewrap svg { width: 100%; height: auto; }
#dataside .hint { margin: 6px 0 0; }
.schemesvg .supp { cursor: pointer; }
.schemesvg .supp:hover .suphl { fill: var(--acc2); stroke: var(--acc); }
.secedit .zhit { cursor: pointer; }
.secedit .zhit:hover { fill: var(--acc); fill-opacity: .14; stroke: var(--acc); stroke-dasharray: 4 3; }
.rebbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 0 0 12px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel2); }
.rebbar .ttl { font-weight: 650; color: var(--acc3); margin-right: 4px; font-size: 12.5px; }
.rebbar select { width: auto; height: 28px; }
.zed { display: flex; flex-direction: column; gap: 8px; }
.zed .zl { border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; background: var(--panel2); }
.zed .zl h5 { margin: 0 0 6px; font-size: 12.5px; color: var(--acc3); display: flex; align-items: center; gap: 8px; }
.zed .zl h5 .sp { flex: 1; }
.zed .zg { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 3px 0; font-size: 12.5px; color: var(--ink2); }
.zed .zg select { width: auto; height: 26px; }
.zed .zg .txt { height: 26px; width: 74px; text-align: right; }
.zed .zg .txt.wide { width: 220px; text-align: left; }
.zed .iss { font-size: 12px; color: var(--fail); }
.zed .okm { font-size: 12px; color: var(--ok); }
.dlg.zpop { max-width: 980px !important; }
.zpop .zcols { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; }
.zpop .zprev { position: sticky; top: 0; }
.zpop .fields { display: block; }
.suppop .zg { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 6px 0; font-size: 13px; }
.suppop label.rad { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; cursor: pointer; flex: 1 1 180px; }
.suppop label.rad.on { border-color: var(--acc); background: var(--acc2); }
.suppop .txt { width: 110px; height: 28px; text-align: right; }
.suppop label.rad svg { flex: none; }
.suppop label.rad small { color: var(--ink3); }
.suptab { margin-top: 6px; }
.suptab tr { cursor: pointer; }
.suptab tr:hover td { background: var(--acc2); }
.suptab td { font-size: 12px; padding: 3px 6px; }
.kv.suptab td:nth-child(2) { text-align: left; font-weight: 400; }
.kv.suptab td:nth-child(3) { white-space: nowrap; }
.zprev table.kv td:nth-child(2) { white-space: nowrap; }
.rebbar label.vib { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink2); margin-left: auto; }
.rebbar label.vib.vibon { cursor: pointer; }
.rebbar label.vib.vibon + label.vib { margin-left: 0; }
.rebbar label.vib.off { opacity: 0.45; }
.rebbar .btn.sm { text-align: left; }
.dlg.fpop { max-width: 620px; }
.dlg.fpop .fields { padding: 0; }
.minisec svg { max-width: 100%; height: auto; }
.zed .hint { margin: 2px 0; }
#out { flex: 1; display: flex; flex-direction: column; min-width: 0; }

/* ---------- formularz */
details.grp { border-bottom: 1px solid var(--line); }
details.grp > summary { list-style: none; cursor: pointer; padding-block: 9px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 16px; font-weight: 650; font-size: 12.5px; letter-spacing: .3px; text-transform: uppercase; color: var(--acc3); background: var(--panel2); display: flex; align-items: center; gap: 8px; user-select: none; }
details.grp > summary::-webkit-details-marker { display: none; }
details.grp > summary::before { content: ""; width: 7px; height: 7px; border-right: 2px solid var(--ink3); border-bottom: 2px solid var(--ink3); transform: rotate(-45deg); transition: transform .12s; margin-right: 2px; }
details.grp[open] > summary::before { transform: rotate(45deg); }
.fields { padding-block: 6px 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 16px; }
.row { display: grid; grid-template-columns: 1fr 156px 38px; align-items: center; gap: 6px; min-height: 30px; }
.row label { color: var(--ink2); font-size: 12.5px; }
.row .unit { color: var(--ink3); font-size: 11.5px; }
.row.wide { grid-template-columns: 1fr 218px; }
.hint { font-size: 11.5px; color: var(--ink3); margin: 0 0 6px; padding-left: 2px; }
.hint b { color: var(--ink2); font-weight: 600; }
select, .combo input, .txt, .mtab input { height: 26px; border: 1px solid var(--line); border-radius: 4px; background: var(--field); font: inherit; color: var(--ink); padding: 0 6px; width: 100%; }
select:focus, .combo input:focus, .txt:focus, .mtab input:focus { outline: 2px solid var(--focus); outline-offset: -1px; border-color: var(--acc); }
select { padding-right: 2px; }
.combo { display: flex; position: relative; }
.combo input { border-radius: 4px 0 0 4px; text-align: right; padding-right: 6px; }
.combo button { width: 24px; border: 1px solid var(--line); border-left: 0; background: var(--panel2); border-radius: 0 4px 4px 0; cursor: pointer; color: var(--ink2); padding: 0; }
.combo button:hover { background: var(--acc2); }
.combo input.bad, .txt.bad, .mtab input.bad { border-color: var(--fail); background: var(--failbg); }
.chk { display: flex; align-items: center; gap: 8px; min-height: 28px; color: var(--ink2); font-size: 12.5px; cursor: pointer; }
.chk input { width: 15px; height: 15px; margin: 0; accent-color: var(--acc); flex: none; }
.barrow { display: grid; grid-template-columns: 1fr 60px 14px 74px 38px; align-items: center; gap: 4px; min-height: 30px; }
.barrow .x { text-align: center; color: var(--ink3); }
.barrow label { color: var(--ink2); font-size: 12.5px; }
.mtab { width: 100%; border-collapse: collapse; margin: 4px 0 8px; }
.mtab th { font-weight: 500; color: var(--ink3); font-size: 11.5px; padding: 2px; text-align: center; }
.mtab td { padding: 2px; }
.mtab td:first-child { color: var(--ink2); font-size: 12px; white-space: nowrap; }
.mtab input { height: 25px; text-align: right; padding: 0 5px; }
#pop { position: fixed; z-index: 130; background: var(--panel); color: var(--ink); border: 1px solid var(--line); box-shadow: 0 6px 18px var(--shadow); border-radius: 4px; max-height: 260px; overflow-y: auto; display: none; min-width: 120px; }
#pop div { padding: 4px 10px; cursor: pointer; text-align: right; }
#pop div:hover, #pop div.cur { background: var(--acc2); color: var(--acc3); }

/* ---------- zakładki */
.tabs { display: flex; flex-wrap: wrap; gap: 2px; padding-block: 8px 0; padding-left: 12px; padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--bg); border-bottom: 1px solid var(--line); }
.tabs button { border: 1px solid transparent; border-bottom: 0; background: transparent; padding: 7px 14px; cursor: pointer; color: var(--ink2); border-radius: 5px 5px 0 0; font-weight: 550; }
.tabs button:hover { color: var(--ink); background: var(--hover); }
.tabs button.on { background: var(--panel); border-color: var(--line); color: var(--acc3); margin-bottom: -1px; }
.pane { display: none; flex: 1; overflow: auto; background: var(--panel); padding-block: 16px 30px; padding-left: 18px; padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.pane.on { display: block; }
.tscroll { max-width: 100%; overflow-x: auto; }

/* ---------- podsumowanie */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(178px, 1fr)); gap: 10px; margin-bottom: 16px; }
.card { border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; background: var(--panel); position: relative; overflow: hidden; min-width: 0; }
.card .t { font-size: 11.5px; color: var(--ink3); text-transform: uppercase; letter-spacing: .3px; font-weight: 600; }
.card .v { font-size: 20px; font-weight: 650; margin-top: 3px; }
.card .s { font-size: 12px; color: var(--ink2); margin-top: 1px; }
.card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--line); }
.card.ok::before { background: var(--ok); } .card.fail::before { background: var(--fail); } .card.warn::before { background: var(--warn); }
.msgs { margin: 0 0 14px; }
.msg { padding: 7px 10px; border-radius: 4px; margin-bottom: 6px; font-size: 12.5px; }
.msg.err { background: var(--failbg); color: var(--fail); border: 1px solid var(--errln); }
.msg.wrn { background: var(--warnbg); color: var(--warn); border: 1px solid var(--wrnln); }
table.ctab { width: 100%; border-collapse: collapse; font-size: 12.5px; }
table.ctab th { text-align: left; font-weight: 600; color: var(--ink3); font-size: 11.5px; padding: 6px 8px; border-bottom: 1px solid var(--line); background: var(--panel2); position: sticky; top: -16px; z-index: 1; }
table.ctab td { padding: 5px 8px; border-bottom: 1px solid var(--line2); vertical-align: middle; }
table.ctab tr.g td { background: var(--grp); font-weight: 650; color: var(--acc3); padding-top: 9px; font-size: 12px; letter-spacing: .2px; }
table.ctab td.ref { color: var(--ink3); white-space: nowrap; font-size: 11.5px; }
table.ctab td.val { white-space: nowrap; text-align: right; font-family: var(--ui); }
table.ctab td.nt { color: var(--ink3); font-size: 11.5px; }
.ub { width: 120px; height: 8px; background: var(--ubbg); border-radius: 4px; overflow: hidden; display: inline-block; vertical-align: middle; }
.ub i { display: block; height: 100%; background: var(--ok); }
.ub.warn i { background: var(--ubwarn); } .ub.fail i { background: var(--fail); }
.pct { display: inline-block; width: 48px; text-align: right; margin-left: 6px; font-weight: 600; font-size: 12px; }
.st { display: inline-block; min-width: 26px; padding: 1px 7px; border-radius: 10px; font-size: 11px; font-weight: 700; text-align: center; }
.st.ok { background: var(--okbg); color: var(--ok); } .st.fail { background: var(--failbg); color: var(--fail); } .st.warn { background: var(--warnbg); color: var(--warn); } .st.info { background: var(--infobg); color: var(--info); }

/* ---------- przekroje i wykresy */
.h2 { font-size: 14px; font-weight: 650; margin: 4px 0 10px; color: var(--ink); text-wrap: balance; }
.h2 small { font-weight: 400; color: var(--ink3); margin-left: 6px; }
.flex { display: flex; flex-wrap: wrap; gap: 18px; align-items: flex-start; }
.flex > * { min-width: 0; }
.box { border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; background: var(--panel); max-width: 100%; overflow-x: auto; }
.box h4 { margin: 0 0 6px; font-size: 12.5px; color: var(--acc3); }
svg text { font-family: var(--ui); }
.kv { border-collapse: collapse; font-size: 12.5px; }
.kv td { padding: 2px 10px 2px 0; }
.kv td:first-child { color: var(--ink2); }
.kv td:nth-child(2) { text-align: right; font-weight: 600; }
.kv td:nth-child(3) { color: var(--ink3); }
table.sched { border-collapse: collapse; font-size: 12.5px; margin-top: 10px; min-width: 640px; }
table.sched th, table.sched td { border: 1px solid var(--line); padding: 4px 8px; }
table.sched th { background: var(--panel2); font-weight: 600; color: var(--ink2); font-size: 12px; }
table.sched td.n { text-align: right; }
table.sched tr.tot td { font-weight: 700; background: var(--panel2); }

/* ---------- raport */
:is(#report, #ownrep) { max-width: 980px; margin: 0 auto; font-size: 12.5px; color: #000; background: #fff; padding: 18px 22px; border-radius: 4px;
  --ok: #1d7f3c; --warn: #a35d00; --fail: #c0262d; --info: #5b6576; --ink: #000; --ink2: #000; --ink3: #000; }
:is(#report, #ownrep) h1 { font-size: 20px; margin: 0 0 4px; text-wrap: balance; }
:is(#report, #ownrep) h2 { font-size: 15px; margin: 22px 0 8px; padding: 4px 0 0; color: #000; page-break-after: avoid; }
:is(#report, #ownrep) h3 { font-size: 13px; margin: 14px 0 6px; color: #000; page-break-after: avoid; }
:is(#report, #ownrep) p { margin: 4px 0 6px; }
:is(#report, #ownrep) .eq { padding: 2px 0 2px 14px; line-height: 1.7; page-break-inside: avoid; overflow-wrap: anywhere; color: #000; }
:is(#report, #ownrep) .eq .r { color: #000; font-size: 11px; margin-left: 8px; }
:is(#report, #ownrep) .eq b { color: #000; }
:is(#report, #ownrep) .eq .ok, :is(#report, #ownrep) .ok { color: var(--ok); font-weight: 700; } :is(#report, #ownrep) .eq .fail, :is(#report, #ownrep) .fail { color: var(--fail); font-weight: 700; } :is(#report, #ownrep) .eq .warn, :is(#report, #ownrep) .warn { color: var(--warn); font-weight: 700; }
:is(#report, #ownrep) .info { color: var(--info); font-weight: 700; }
:is(#report, #ownrep) .note { color: #000; font-size: 11.5px; font-style: italic; }
:is(#report, #ownrep) .fig { display: flex; gap: 16px; flex-wrap: wrap; margin: 8px 0; page-break-inside: avoid; max-width: 100%; overflow-x: auto; }
:is(#report, #ownrep) .verdict { margin-top: 16px; font-weight: 700; font-size: 13px; }
.rtools { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; align-items: center; max-width: 980px; margin: 0 auto 8px; }
.rtools .hint { margin: 0 auto 0 0; max-width: 520px; }
.btn { border: 1px solid var(--line); background: var(--panel); padding: 6px 12px; border-radius: 4px; cursor: pointer; color: var(--ink); }
.btn:hover { background: var(--acc2); border-color: var(--addln); }
.btn.pri { background: var(--acc); color: var(--onacc); border-color: var(--acc); }
.btn.pri:hover { background: var(--acc3); border-color: var(--acc3); color: var(--panel); }
.btn.dng { color: var(--fail); }
.btn.dng:hover { background: var(--failbg); border-color: var(--errln); }
.btn:disabled { opacity: .5; cursor: default; }

/* ---------- okna dialogowe */
#modal { position: fixed; inset: 0; background: var(--scrim); display: none; align-items: center; justify-content: center; z-index: 100; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-bottom, 0px)); }
#modal .dlg { background: var(--panel); color: var(--ink); border-radius: 8px; padding: 20px 24px; width: 100%; max-width: 640px; max-height: 85vh; overflow: auto; box-shadow: 0 16px 50px var(--shadow); }
#modal .dlg.sm { max-width: 420px; }

#out .verdict.fail { background: var(--failbg); border-color: var(--errln); }
#out .verdict b { color: inherit; }
.schhd { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin-bottom: 6px; }
.schhd > b { color: var(--acc3); font-size: 12.5px; margin-right: auto; }
.schemewrap svg { display: block; width: 100%; height: auto; touch-action: none; }
svg .hot { cursor: pointer; }
svg .hot:hover { filter: drop-shadow(0 0 2px var(--acc)); }
svg .hdl { cursor: grab; }
svg .hdl:hover { r: 8.5; }
body.dsdrag, body.dsdrag * { cursor: col-resize !important; user-select: none; }
.etaleg { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 11.5px; color: var(--ink2); margin: 6px 0 2px; }
.etaleg span { display: inline-flex; align-items: center; gap: 5px; }
.etaleg i { display: inline-block; width: 18px; height: 10px; border-radius: 2px; opacity: .75; }
.etaleg i.ln { height: 0; border-top: 3px dashed; background: none; opacity: 1; }
.etaleg i.ln.s { border-top-style: solid; }
.stmgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 12px; margin-top: 12px; align-items: start; }
.stmgrid .box table.sched { min-width: 0; width: 100%; }
.optgrid { display: grid; grid-template-columns: minmax(340px, 520px) minmax(0, 1fr); gap: 12px; align-items: start; }
@media (max-width: 1100px) { .optgrid { grid-template-columns: minmax(0, 1fr); } }
.rbfig { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-start; }
.rbfig > svg { flex: 1 1 520px; max-width: 100%; height: auto; }
.rbfig .secs { display: flex; flex-wrap: wrap; gap: 10px; }
.rbfig .secs svg { width: 300px; max-width: 100%; height: auto; }
.rng { display: inline-flex; align-items: center; gap: 4px; }
.rng .txt { width: 58px; text-align: right; height: 26px; }
.eqx { font-family: "Cambria Math", "Times New Roman", serif; font-size: 14px; background: var(--panel2); border: 1px solid var(--line2); border-radius: 5px; padding: 7px 10px; margin: 4px 0; line-height: 1.6; overflow-x: auto; color: var(--ink); }
ul.alist { margin: 4px 0; padding-left: 18px; font-size: 12.5px; color: var(--ink2); }
ul.alist li { margin: 2px 0; }
#modal .dlg.wide { max-width: 1100px; }
table.sched.ndptab td { vertical-align: top; font-size: 12px; }
table.sched.ndptab tr.over td { background: var(--warnbg); }
table.sched tr.gov td { background: var(--acc2); }
table.sched.opttab tr.nok td { color: var(--ink3); }
table.sched.cmbt { min-width: 0; }
.stmgrid table.kv td:nth-child(2) { white-space: nowrap; }
.failnav { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 0 0 8px; font-size: 12.5px; color: var(--fail); font-weight: 600; }
.failnav .goto { font-weight: 400; }
.goto { border: 1px solid var(--line); background: var(--panel); color: var(--acc); border-radius: 4px; padding: 1px 7px; font-size: 11.5px; cursor: pointer; margin-left: 6px; }
.goto:hover { background: var(--acc2); border-color: var(--addln); }
:is(#report) h1 { font-size: 19px; }
:is(#report) h4 { font-size: 12.5px; margin: 10px 0 2px; }
:is(#report) h4 .r { font-weight: 400; font-size: 11px; margin-left: 8px; color: #333; }
:is(#report) table.rtab { min-width: 0; width: 100%; margin: 6px 0 10px; font-size: 11.5px; color: #000; }
:is(#report) table.rtab th { background: #f2f4f7; color: #000; }
:is(#report) .verdict { border: 1px solid #999; padding: 8px 10px; border-radius: 4px; }
:is(#report) .verdict.ok { border-color: var(--ok); } :is(#report) .verdict.fail { border-color: var(--fail); } :is(#report) .verdict.warn { border-color: var(--warn); }
:is(#report) ul { margin: 4px 0 8px; padding-left: 20px; }
:is(#report) li { margin: 1px 0; }
:is(#report) .fig svg { max-width: 100%; height: auto; }
@media print { .rtools, .dsumx { display: none !important; } #p-report { display: block !important; } }

/* Rekord sprawdzenia — odpowiednik kwst.checks_common.make (wartości E_d, R_d w jednostkach bazowych) */
function make(o) {

    R_d: o.R_d === undefined ? null : o.R_d, kind: o.kind || 'none', eta: null, status: ST.NA,
    conclusion: o.conclusion || '', combination: o.combination || '', element_ref: o.element_ref || '',

  '6.5.4': { t: 'Węzły', s: 'Nośność węzła zależy od rodzaju: CCC (tylko ściskanie), CCT (cięgno zakotwione w jednym kierunku), CTT (cięgna w więcej niż jednym kierunku). Naprężenia na ściankach węzła nie mogą przekraczać σ<sub>Rd,max</sub>. Dopuszcza się zwiększenie o 10% w określonych sytuacjach (6.5.4(5)) – wymaga uzasadnienia.', f: 'CCC: σ<sub>Rd,max</sub> = k<sub>1</sub>·ν′·f<sub>cd</sub> (6.60);  CCT: k<sub>2</sub>·ν′·f<sub>cd</sub> (6.61);  CTT: k<sub>3</sub>·ν′·f<sub>cd</sub> (6.62)', h: 'Węzeł A (pod płytą) – CCT: ścianka docisku i ścianka krzyżulca. Węzeł B (przy licu słupa) – CCC, hydrostatyczny: jednakowe naprężenia na ściankach. Zbrojenie cięgna musi przechodzić przez cały węzeł A (6.5.4(7)).' },
  '6.7': { t: 'Docisk lokalny', s: 'Przy obciążeniu rozłożonym na polu A<sub>c0</sub> nośność zwiększa się dzięki rozdziałowi na większe pole A<sub>c1</sub> (podobne, współśrodkowe, ograniczone krawędziami i wysokością), z ograniczeniem do 3,0·f<sub>cd</sub>·A<sub>c0</sub>. Siły rozłupujące muszą być przeniesione zbrojeniem.', f: 'F<sub>Rdu</sub> = A<sub>c0</sub>·f<sub>cd</sub>·√(A<sub>c1</sub>/A<sub>c0</sub>) ≤ 3,0·f<sub>cd</sub>·A<sub>c0</sub> (6.63)', h: 'Pole A<sub>c1</sub> jest w programie ograniczane konserwatywnie (krawędzie wspornika, lico słupa, wysokość w miejscu obciążenia).' },

  '8.3': { t: 'Dopuszczalne średnice trzpieni do gięcia', s: 'Minimalna średnica trzpienia zapobiega uszkodzeniu pręta (tabl. 8.1N). Gdy pręt odgięty jest w pełni wykorzystany, trzeba dodatkowo sprawdzić docisk betonu wewnątrz odgięcia – wzór (8.1).', f: 'φ<sub>m,min</sub> = 4φ (φ ≤ 16 mm) lub 7φ (φ > 16 mm);  φ<sub>m,min</sub> ≥ F<sub>bt</sub>·((1/a<sub>b</sub>) + 1/(2φ))/f<sub>cd</sub> (8.1)', h: 'Program przyjmuje F<sub>bt</sub> równe pełnej sile w pręcie (konserwatywnie) i f<sub>cd</sub> nie większe niż dla C55/67.' },

  '8.6': { t: 'Zakotwienie przyspawanymi prętami', s: 'Przyspawany pręt poprzeczny zwiększa nośność zakotwienia. Nośność pojedynczego pręta poprzecznego F<sub>btd</sub> zależy od otuliny, średnicy i wytrzymałości spoiny; o tę siłę zmniejsza się naprężenie w zakotwianym pręcie.', f: 'F<sub>btd</sub> = l<sub>td</sub>·φ<sub>t</sub>·σ<sub>td</sub> ≤ F<sub>wd</sub> (8.8N)', h: 'Jakość połączenia spawanego wymaga wykazania (EN ISO 17660). Program wybiera korzystniejszą z dróg: α<sub>4</sub> = 0,7 lub redukcja σ<sub>sd</sub> wg 8.6(2).' },
  '9.2.1.1': { t: 'Minimalne i maksymalne zbrojenie podłużne (belki)', s: 'Zbrojenie podłużne nie powinno być mniejsze od minimum zapobiegającego kruchemu zniszczeniu ani większe od maksimum poza zakładami.', f: 'A<sub>s,min</sub> = 0,26·(f<sub>ctm</sub>/f<sub>yk</sub>)·b<sub>t</sub>·d ≥ 0,0013·b<sub>t</sub>·d (9.1N);  A<sub>s,max</sub> = 0,04·A<sub>c</sub>', h: 'Dla wspornika stosowane przez analogię – status „zalecenie inżynierskie”; niespełnienie daje WYMAGA OSOBNEJ WERYFIKACJI, a nie NIE SPEŁNIONO.' },
  '10.9.5': { t: 'Oparcia elementów prefabrykowanych', s: 'Długość oparcia netto a<sub>1</sub> wynika z siły i nośności obliczeniowej na docisk f<sub>Rd</sub> (zależnej od rodzaju połączenia) oraz minimalnych wartości tabl. 10.2. Uwzględnia się odległości od krawędzi i tolerancje (tabl. 10.3–10.5) oraz siły od więzów (skurcz, pełzanie, temperatura).', f: 'a<sub>1</sub> = F<sub>Ed</sub>/(b<sub>1</sub>·f<sub>Rd</sub>) ≥ a<sub>1,min</sub> (10.6)', h: 'Program nie stosuje tych wartości automatycznie, dopóki projektant nie potwierdzi parametrów f<sub>Rd</sub> i tabl. 10.2 (status do potwierdzenia).' },
  'J': { t: 'Załącznik J (informacyjny) – szczegóły konstrukcyjne w szczególnych przypadkach', s: 'Załącznik J zawiera m.in. zasady projektowania wsporników krótkich (J.3). Jako informacyjny może być zmieniony lub uzupełniony przez Załącznik Krajowy.', h: 'Sprawdzenia oparte na zał. J mają w programie podstawę „informacyjne (zał. J)”.' },
  'J.3': { t: 'Wsporniki krótkie', s: 'Wsporniki o a<sub>c</sub> < z<sub>0</sub> projektuje się modelem kratownicowym (rys. J.5): krzyżulec od płyty do strefy ściskanej przy licu słupa i cięgno górą, zakotwione za węzłem pod obciążeniem i w słupie. Nachylenie krzyżulca ograniczone jest warunkiem 1,0 ≤ tan θ ≤ 2,5. Przy a<sub>c</sub> < 0,5·h<sub>c</sub> zaleca się strzemiona poziome lub ukośne (rys. J.6a), a przy a<sub>c</sub> > 0,5·h<sub>c</sub> i F<sub>Ed</sub> > V<sub>Rd,c</sub> – strzemiona pionowe (rys. J.6b).', f: 'F<sub>td</sub> = F<sub>Ed</sub>·a<sub>c</sub>/z<sub>0</sub> + H<sub>Ed</sub>·(a<sub>H</sub> + z<sub>0</sub>)/z<sub>0</sub>;  A<sub>s,lnk</sub> ≥ k<sub>1</sub>·A<sub>s,main</sub> (J.3(2));  A<sub>s,lnk</sub> ≥ k<sub>2</sub>·F<sub>Ed</sub>/f<sub>yd</sub> (J.3(3))', h: 'Gdy tan θ < 1 (a<sub>c</sub> ≥ z<sub>0</sub>), element nie jest krótkim wspornikiem – program oznacza model jako poza zakresem i NIE wymiaruje go jak belki wspornikowej.' },
  '1990': { t: 'Kombinacje oddziaływań (PN-EN 1990)', s: 'W SGN dla sytuacji trwałych i przejściowych stosuje się wzór (6.10) albo mniej korzystną z par (6.10a)/(6.10b); oddziaływania wyjątkowe – (6.11b). W SGU kombinacja quasi-stała (6.16) służy do kontroli rys.', f: 'Σγ<sub>G</sub>G<sub>k</sub> + γ<sub>Q,1</sub>Q<sub>k,1</sub> + Σγ<sub>Q,i</sub>ψ<sub>0,i</sub>Q<sub>k,i</sub> (6.10);  ΣG<sub>k</sub> + Σψ<sub>2,i</sub>Q<sub>k,i</sub> (6.16)', h: 'Obciążenia podane jako wartości obliczeniowe nie są ponownie mnożone przez współczynniki częściowe.' },
  'model': { t: 'Kontrola modelu obliczeniowego', s: 'Sprawdzenia oznaczone jako „kontrola modelu” nie są wymaganiami normy, lecz warunkami poprawności obliczeń: równowaga, stateczność kratownicy, spójność geometrii pola naprężeń z obrysem betonu, położenie osi cięgna.', h: 'Niespełnienie kontroli modelu oznacza, że wyniki sprawdzeń normowych nie są wiarygodne.' },

  '8.1': '8.3', '8.2': '8.4', '8.3': '8.4', '8.4': '8.4', '8.5': '8.4', '8.6': '8.4', '8.8N': '8.6', '9.1N': '9.2.1.1', '10.6': '10.9.5', '7.6N': '7.3.3', '7.7N': '7.3.3' };

<script>/* KRÓTKI WSPORNIK ST – raport obliczeń (notka): dane, parametry normowe, model STM, sprawdzenia z wzorami i podstawieniami,

  const ps = (n, o) => `<style:style style:name="${n}" style:family="paragraph"${o.parent ? ` style:parent-style-name="${o.parent}"` : ''}><style:paragraph-properties fo:margin-top="${o.mt || '0cm'}" fo:margin-bottom="${o.mb || '0.1cm'}"${o.ml ? ` fo:margin-left="${o.ml}"` : ''}${o.tab ? '><style:tab-stops><style:tab-stop style:position="16.5cm" style:type="right"/></style:tab-stops></style:paragraph-properties>' : '/>'}<style:text-properties fo:font-size="${o.fs || '10pt'}"${o.b ? ' fo:font-weight="bold"' : ''}${o.c ? ` fo:color="${o.c}"` : ''}${o.it ? ' fo:font-style="italic"' : ''}/></style:style>`;
  const styles = `<?xml version="1.0" encoding="UTF-8"?><office:document-styles ${NS}><office:styles><style:default-style style:family="paragraph"><style:text-properties style:font-name="Calibri" fo:font-family="Calibri, Arial, sans-serif" fo:font-size="10pt" fo:language="pl" fo:country="PL"/></style:default-style></office:styles><office:automatic-styles><style:page-layout style:name="PL"><style:page-layout-properties fo:page-width="21cm" fo:page-height="29.7cm" fo:margin-top="1.8cm" fo:margin-bottom="1.8cm" fo:margin-left="2cm" fo:margin-right="1.8cm"/></style:page-layout></office:automatic-styles><office:master-styles><style:master-page style:name="Standard" style:page-layout-name="PL"/></office:master-styles></office:document-styles>`;
  const content = `<?xml version="1.0" encoding="UTF-8"?><office:document-content ${NS}><office:automatic-styles>` +
    ps('Title', { fs: '16pt', b: true, mb: '0.3cm' }) + ps('H1', { fs: '13pt', b: true, mt: '0.4cm', mb: '0.15cm', c: '#1d3f78' }) + ps('H2', { fs: '13pt', b: true, mt: '0.4cm', mb: '0.15cm', c: '#1d3f78' }) + ps('H3', { fs: '11pt', b: true, mt: '0.25cm', mb: '0.1cm' }) + ps('H4', { fs: '10pt', b: true, mt: '0.2cm' }) +
    ps('Body', {}) + ps('Eq', { ml: '0.4cm', tab: true }) + ps('Note', { fs: '9pt', it: true, c: '#4a5466' }) + ps('Verdict', { fs: '11pt', b: true, mt: '0.3cm' }) + ps('Li', { ml: '0.4cm' }) + ps('Fig', { mt: '0.2cm', mb: '0.2cm' }) + ps('Td', { fs: '9pt', mb: '0cm' }) + ps('Th', { fs: '9pt', b: true, mb: '0cm' }) +
    `<style:style style:name="Tsub" style:family="text"><style:text-properties style:text-position="sub 58%"/></style:style><style:style style:name="Tsup" style:family="text"><style:text-properties style:text-position="super 58%"/></style:style><style:style style:name="Tb" style:family="text"><style:text-properties fo:font-weight="bold"/></style:style>` +
    `<style:style style:name="Tok" style:family="text"><style:text-properties fo:color="#1d7f3c" fo:font-weight="bold"/></style:style><style:style style:name="Tfail" style:family="text"><style:text-properties fo:color="#c0262d" fo:font-weight="bold"/></style:style><style:style style:name="Twarn" style:family="text"><style:text-properties fo:color="#a35d00" fo:font-weight="bold"/></style:style>` +
    `<style:style style:name="Tab" style:family="table"><style:table-properties style:width="17cm" table:align="left" fo:margin-top="0.15cm" fo:margin-bottom="0.15cm"/></style:style><style:style style:name="Cell" style:family="table-cell"><style:table-cell-properties fo:padding="0.05cm" fo:border="0.5pt solid #9aa3b0"/></style:style>` +
    `</office:automatic-styles><office:body><office:text>${body}</office:text></office:body></office:document-content>`;
  const manifest = `<?xml version="1.0" encoding="UTF-8"?><manifest:manifest xmlns:manifest="urn:oasis:names:tc:opendocument:xmlns:manifest:1.0" manifest:version="1.2"><manifest:file-entry manifest:full-path="/" manifest:media-type="application/vnd.oasis.opendocument.text" manifest:version="1.2"/><manifest:file-entry manifest:full-path="content.xml" manifest:media-type="text/xml"/><manifest:file-entry manifest:full-path="styles.xml" manifest:media-type="text/xml"/>${pics.map(p => `<manifest:file-entry manifest:full-path="${p.name}" manifest:media-type="image/png"/>`).join('')}</manifest:manifest>`;

  return WR.zip([{ name: 'mimetype', data: enc.encode('application/vnd.oasis.opendocument.text') }, { name: 'META-INF/manifest.xml', data: enc.encode(manifest) }, { name: 'styles.xml', data: enc.encode(styles) }, { name: 'content.xml', data: enc.encode(content) }, ...pics]);
};
// ZIP (metoda „stored”, CRC-32) – wystarcza dla OpenDocument
WR.zip = function (files) {
  const T = WR._crcT || (WR._crcT = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })());
  const crc = u => { let c = 0xFFFFFFFF; for (let i = 0; i < u.length; i++) c = T[(c ^ u[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
  const enc = new TextEncoder(), parts = [], cen = []; let off = 0;
  const d = new Date(), dt = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate(), tm = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
  files.forEach(f => {
    const nm = enc.encode(f.name), c = crc(f.data), sz = f.data.length;
    const lh = new DataView(new ArrayBuffer(30)); lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true); lh.setUint16(10, tm, true); lh.setUint16(12, dt, true); lh.setUint32(14, c, true); lh.setUint32(18, sz, true); lh.setUint32(22, sz, true); lh.setUint16(26, nm.length, true); lh.setUint16(28, 0, true);
    parts.push(new Uint8Array(lh.buffer), nm, f.data);
    const ch = new DataView(new ArrayBuffer(46)); ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true); ch.setUint16(10, 0, true); ch.setUint16(12, tm, true); ch.setUint16(14, dt, true); ch.setUint32(16, c, true); ch.setUint32(20, sz, true); ch.setUint32(24, sz, true); ch.setUint16(28, nm.length, true); ch.setUint32(42, off, true);
    cen.push(new Uint8Array(ch.buffer), nm);
    off += 30 + nm.length + sz;
  });
  const cs = cen.reduce((a, u) => a + u.length, 0), ed = new DataView(new ArrayBuffer(22)); ed.setUint32(0, 0x06054b50, true); ed.setUint16(8, files.length, true); ed.setUint16(10, files.length, true); ed.setUint32(12, cs, true); ed.setUint32(16, off, true);
  const all = [...parts, ...cen, new Uint8Array(ed.buffer)], n = all.reduce((a, u) => a + u.length, 0), out = new Uint8Array(n); let p = 0; all.forEach(u => { out.set(u, p); p += u.length; });

};
})();

<script>/* KRÓTKI WSPORNIK ST – zakładki wyników: Model STM, Zbrojenie wspornika, Optymalizacja, Raport; okna NDP, porównania, elementu */
(function () {
'use strict';
const WS = window.WS, WD = window.WD, ND = WS.ND;
const WV = window.WV = {};
const U = () => window.WU;
const ST_NAME = { ok: 'OK', fail: 'NIE', warn: 'UWAGA', na: 'N/D' };
const kNs = v => U().fmt(v / 1e3, 1);
const paneW = el => Math.max(520, Math.min(1180, (el.clientWidth || 1100) - 40));
const tb = (head, rows, cls) => `<div class="tscroll"><table class="sched ${cls || ''}"><tr>${head.map(h => `<th>${h}</th>`).join('')}</tr>${rows.map(r => `<tr>${r.map((c, i) => `<td${i && typeof c === 'string' && /^[−\d\s,.∞—%]+$/.test(c) ? ' class="n"' : ''}>${c}</td>`).join('')}</tr>`).join('')}</table></div>`;

/* ------------------------------------------------------------ okno elementu modelu (klik na rysunku) */
WV.elementPopup = function (ref, combo) {
  const u = U(), R = u.R, { esc, fmt, sym } = u, sr = R.stm[combo] || R.stm[R.governing];
  const id = ref.split(':')[1], cs = R.checks.filter(c => c.element_ref === ref);
  let info = '';
  if (ref.startsWith('node:')) {
    const nz = sr.nodes[id], q = sr.truss.nodes.find(n => n.id === id);
    info = `<table class="kv"><tr><td>Położenie x / y</td><td>${fmt(q.x, 1)} / ${fmt(q.y, 1)}</td><td>mm</td></tr>${nz ? `<tr><td>Typ węzła</td><td>${esc(nz.type)}</td><td></td></tr>` : ''}${sr.solution.reactions[id] ? `<tr><td>Reakcja R<sub>x</sub> / R<sub>y</sub></td><td>${kNs(sr.solution.reactions[id][0])} / ${kNs(sr.solution.reactions[id][1])}</td><td>kN</td></tr>` : ''}</table>` +
      (nz && nz.faces.length ? tb(['Ścianka', 'F [kN]', 'długość [mm]', 't [mm]', 'σ [MPa]'], nz.faces.map(f => [esc(f.name), kNs(f.F), fmt(f.length, 1), fmt(f.t, 0), fmt(f.sigma, 2)])) : '');
  } else {
    const s = sr.struts.find(x => x.id === id), t = sr.ties.find(x => x.id === id), N = sr.solution.forces[id];
    info = `<table class="kv"><tr><td>Siła osiowa N</td><td>${kNs(N)}</td><td>kN (${N < 0 ? 'ściskanie' : 'rozciąganie'})</td></tr>${s ? `<tr><td>Szerokości w<sub>1</sub> / w<sub>2</sub></td><td>${fmt(s.w1, 1)} / ${fmt(s.w2, 1)}</td><td>mm</td></tr><tr><td>Grubości t<sub>1</sub> / t<sub>2</sub></td><td>${fmt(s.t1, 0)} / ${fmt(s.t2, 0)}</td><td>mm</td></tr><tr><td>Długość / θ</td><td>${fmt(s.length, 0)} / ${fmt(s.theta_deg, 1)}°</td><td></td></tr><tr><td>Kształt</td><td>${esc(s.shape)}</td><td>b<sub>dost</sub> = ${fmt(s.b_avail, 0)} mm</td></tr>` : ''}${t ? `<tr><td>Zbrojenie cięgna A<sub>s</sub></td><td>${fmt(t.As_prov || 0, 0)}</td><td>mm²</td></tr><tr><td>Wysokość strefy cięgna u</td><td>${fmt(t.u, 0)}</td><td>mm</td></tr>` : ''}</table>`;
  }
  const m = u.openModal(`<h3>${ref.startsWith('node:') ? 'Węzeł' : 'Pręt'} ${sym(WD.lab(id))} – kombinacja ${esc(sr.combination)}</h3>${info}<h4 class="lsec">Sprawdzenia elementu</h4>${cs.length ? `<table class="ctab">${cs.map((c, i) => `<tr data-ei="${i}" class="xclick"><td>${sym(c.title)}</td><td class="val">${u.ckCond(c)}</td><td class="bar">${u.utilBar(c)}</td><td><span class="st ${c.status}">${ST_NAME[c.status]}</span></td></tr>`).join('')}</table><p class="hint">Kliknij wiersz – jak obliczono.</p>` : '<p class="hint">Brak sprawdzeń przypisanych do elementu.</p>'}<div class="dbtn"><button class="btn pri" data-close>Zamknij</button></div>`, 'norm');
  u.$$('[data-ei]', m).forEach(tr => tr.addEventListener('click', () => u.explainPopup(cs[+tr.dataset.ei])));
};

/* ------------------------------------------------------------ zakładka Model STM */
let stmCombo = '', stmOpt = { stress: true, forces: true, widths: true, reactions: true, rebar: false, dims: false };
WV.renderStm = function (el) {
  const u = U(), R = u.R, v = u.V(), { esc, fmt, sym } = u;
  const combos = Object.keys(R.stm); if (!combos.includes(stmCombo)) stmCombo = R.governing;
  const sr = R.stm[stmCombo]; if (!sr) { el.innerHTML = '<div class="msg wrn">Brak modelu.</div>'; return; }
  const W = paneW(el), scene = WD.sceneStm(v, R, stmCombo, stmOpt);
  const chip = (k, l) => `<label class="chk" style="display:inline-flex"><input type="checkbox" data-so="${k}" ${stmOpt[k] ? 'checked' : ''}><span>${l}</span></label>`;
  let h = `<div class="dsumx"></div><div class="rebbar"><b>Model STM</b><select id="stmCmb" style="width:auto;min-width:200px">${combos.map(c => `<option ${c === stmCombo ? 'selected' : ''} value="${esc(c)}">${esc(c)}${c === R.governing ? ' – decydująca' : ''}</option>`).join('')}</select>
    ${chip('stress', 'pola naprężeń (η)')}${chip('forces', 'siły')}${chip('widths', 'szerokości')}${chip('reactions', 'reakcje')}${chip('rebar', 'zbrojenie')}${chip('dims', 'wymiary')}<span style="flex:1"></span><button class="btn sm" id="stmDxf">Eksport DXF modelu</button></div>
    <div class="box"><div class="schemewrap stmwrap">${WD.svg(scene, W, { H: Math.min(640, Math.max(480, W * 0.55)) })}</div>${stmOpt.stress ? WD.etaLegend() : ''}<p class="hint">Kliknij węzeł, krzyżulec lub cięgno – siły, wymiary stref i sprawdzenia elementu. ${sr.model_type ? 'Model: ' + esc(sr.model_type) + '.' : ''}</p></div><div class="stmgrid">`;
  // dobór x_c i stan modelu
  Object.entries(sr.sides || {}).forEach(([sd, sm]) => {
    const p = sm.params, s = sm.state, se = sm.search || {};
    h += `<div class="box"><h4>Wspornik ${WS.SIDE_NAME[sd]} – parametry modelu J.3</h4><table class="kv">
      <tr><td>V<sub>Ed</sub> / H<sub>Ed</sub> / M<sub>Ed</sub></td><td>${kNs(p.V)} / ${kNs(p.H)} / ${fmt(p.M / 1e6, 1)}</td><td>kN, kNm</td></tr>
      <tr><td>ξ<sub>A</sub> (położenie węzła A)</td><td>${fmt(p.xi_A, 1)}</td><td>mm</td></tr><tr><td>d / c<sub>t</sub> / u</td><td>${fmt(p.d, 0)} / ${fmt(p.c_t, 0)} / ${fmt(p.u, 0)}</td><td>mm</td></tr>
      <tr><td>a<sub>ef</sub> / t<sub>A</sub> / t<sub>B</sub></td><td>${fmt(p.a_ef, 0)} / ${fmt(p.t_A, 0)} / ${fmt(p.t_B, 0)}</td><td>mm</td></tr><tr><td>a<sub>H</sub></td><td>${fmt(p.a_H, 0)}</td><td>mm</td></tr>
      <tr><td>Dobór x<sub>c</sub></td><td style="text-align:left;font-weight:400" colspan="2">${esc(se.method || '')}; przedział [${fmt(se.x_min, 0)}; ${fmt(se.x_max, 0)}] mm</td></tr>
      <tr><td>x<sub>c</sub> / z<sub>0</sub> / a<sub>B</sub></td><td>${fmt(s.x_c, 1)} / ${fmt(s.z0, 1)} / ${fmt(s.a_B, 1)}</td><td>mm</td></tr>
      <tr><td>F<sub>c</sub> / T / C</td><td>${kNs(s.Fc)} / ${kNs(s.T)} / ${kNs(s.C)}</td><td>kN</td></tr>
      <tr><td>θ / tan θ</td><td>${fmt(s.theta_deg, 2)}° / ${fmt(s.tan_theta, 3)}</td><td>(1,0–2,5)</td></tr>
      <tr><td>w<sub>A</sub> / w<sub>B</sub></td><td>${fmt(s.w_A, 1)} / ${fmt(s.w_B, 1)}</td><td>mm</td></tr></table>${sm.feasible ? '' : `<div class="msg wrn">${esc(sm.infeasible_reason)}</div>`}${(p.notes || []).map(n => `<p class="hint">${esc(n)}</p>`).join('')}</div>`;
  });
  const sol = sr.solution;
  h += `<div class="box"><h4>Siły w prętach i reakcje</h4>${tb(['Pręt', 'typ', 'N [kN]'], sr.truss.members.map(m => [sym(WD.lab(m.id)), m.kind === 'strut' ? 'krzyżulec' : 'cięgno', kNs(sol.forces[m.id] || 0)]))}${tb(['Węzeł', 'x [mm]', 'y [mm]', 'R<sub>x</sub> [kN]', 'R<sub>y</sub> [kN]'], sr.truss.nodes.map(q => [sym(WD.lab(q.id)), fmt(q.x, 1), fmt(q.y, 1), sol.reactions[q.id] ? kNs(sol.reactions[q.id][0]) : '', sol.reactions[q.id] ? kNs(sol.reactions[q.id][1]) : '']))}</div>`;
  h += `<div class="box"><h4>Kontrola modelu</h4><table class="kv"><tr><td>Status rozwiązania</td><td>${esc(sol.status)}</td><td>${esc(sol.method)}</td></tr><tr><td>rank(A) / równań / niewiadomych</td><td>${sol.rank} / ${sol.n_equations} / ${sol.n_unknowns}</td><td></td></tr>
    <tr><td>max residuum węzłowe</td><td>${sol.max_residual.toExponential(2)}</td><td>N (tol ${sol.tolerance.toExponential(1)})</td></tr><tr><td>ΣF<sub>x</sub>, ΣF<sub>y</sub>, ΣM</td><td>${sol.global_residual.map(x => x.toExponential(1)).join('; ')}</td><td>N, N·mm</td></tr>
    <tr><td>Różnica rozw. zamkniętego i macierzowego</td><td>${(sr.comparison.max_rel_diff || 0).toExponential(1)}</td><td></td></tr></table>${(sol.messages || []).map(m => `<p class="hint">${esc(m)}</p>`).join('')}
    <h4 style="margin-top:10px">Walidacja automatyczna</h4><table class="kv">${(R.validation || []).map(it => `<tr><td>${esc(it.name)}</td><td style="color:var(--${it.ok ? 'ok' : 'fail'})">${it.ok ? '✔' : '✖'}</td><td>${esc(it.detail)}</td></tr>`).join('')}</table></div>`;
  h += `<div class="box"><h4>Założenia modelu</h4><ul class="alist">${(R.assumptions || []).map(a => `<li>${esc(a)}</li>`).join('')}</ul></div></div>`;
  el.innerHTML = h;
  u.renderDsum();
  u.$('#stmCmb', el).onchange = e => { stmCombo = e.target.value; WV.renderStm(el); };

  u.$('.stmwrap', el).addEventListener('click', e => { const t = e.target.closest('[data-ref]'); if (t && /^(node|member):/.test(t.dataset.ref)) WV.elementPopup(t.dataset.ref, stmCombo); });

};

/* ------------------------------------------------------------ zakładka Zbrojenie wspornika */

  const ml = R.main, cv = R.cover, mb = R.main_input;
  let h = `<div class="dsumx"></div><div class="rebbar"><b>Zbrojenie wspornika</b><span style="flex:1"></span><button class="btn sm pri" id="rbDxf">Eksport DXF (rysunek zbrojenia)</button><button class="btn sm" id="rbAreas">Tablica pól przekroju prętów</button></div>
    <div class="box"><div class="fig rbfig">${elev}<div class="secs">${secs}</div></div></div><div class="stmgrid">`;
  const tie = R.checks.filter(c => /^TIE_[RL]$/.test(c.id));
  h += `<div class="box"><h4>Zbrojenie główne (cięgno)</h4><table class="kv"><tr><td>Pręty</td><td>${esc(ml.desc())}</td><td>A<sub>s</sub> = ${fmt(ml.As, 0)} mm²</td></tr>${tie.map(c => `<tr><td>A<sub>s,req</sub> = T<sub>Ed</sub>/f<sub>yd</sub> (${c.id.slice(-1)})</td><td>${fmt(c.E_d / R.materials.steel.fyd, 0)}</td><td>mm² (η = ${fmt(c.eta * 100, 0)}%)</td></tr>`).join('')}

/* ------------------------------------------------------------ eksport DXF */
WV.exportDXF = async function (what) {
  const u = U(), R = u.R, v = u.V();
  if (!R || WS.errorsOf(R).length || !R.geometry) { u.toast('Usuń błędy danych przed eksportem rysunku.'); return; }
  const scenes = [];
  const add = (sc, title) => { const bb = WD.bounds(sc.pr); scenes.push({ sc, title, bb }); };
  if (R.main && what !== 'stm') { add(WD.sceneRebar(v, R), 'ZBROJENIE WSPORNIKA'); Object.keys(R.geometry.sides).forEach(sd => add(WD.sceneSection(v, R, sd), 'PRZEKROJ ' + (sd === 'R' ? 'A-A' : 'B-B'))); }
  add(WD.sceneStm(v, R, R.governing, { stress: true, forces: true, widths: true, reactions: true }), 'MODEL STM - ' + R.governing);
  let x = 0; const list = scenes.map(s => { const dx = x - s.bb[0]; x += (s.bb[2] - s.bb[0]) + 400; return { scene: Object.assign(s.sc, { top: s.bb[3] }), dx, dy: 0, title: s.title, th: 20 }; });
  const txt = WD.dxf(list);
  await u.saveAny(u.safeName(what === 'stm' ? ' – model STM.dxf' : ' – zbrojenie.dxf'), txt, 'application/dxf', 'dxf', 'Zapisano rysunek');
};

let optRes = null, optRun = null;
const optDef = () => ({ objective: 'steel', hc: [400, 700, 50], lc: null, b: null, concretes: ['C25/30', 'C30/37', 'C35/45', 'C40/50'], diameters: [12, 14, 16, 20, 25], steel_price: 5.5, max_variants: 300 });
WV.renderOpt = function (el) {

  let h = `<div class="dsumx"></div><div class="optgrid"><div class="box"><h4>Optymalizacja wspornika</h4><p class="hint">Przeszukiwanie siatki wariantów (deterministyczne). Każdy wariant przechodzi pełną analizę z automatycznym doborem zbrojenia – dopuszczalny jest tylko wariant bez błędów, bez niespełnionych sprawdzeń i w zakresie modelu J.3. Wymiary bieżące: h<sub>c</sub> = ${v.geometry.right.h_c} mm, l<sub>c</sub> = ${v.geometry.right.l_c} mm, b = ${v.geometry.b} mm, ${esc(v.materials.concrete)}.</p>
    <div class="fields" style="padding-left:0">
    <div class="row"><label>Kryterium</label><select id="opObj">${Object.entries(WS.OBJECTIVES).map(([k, l]) => `<option value="${k}" ${k === o.objective ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select><span></span></div>
    ${rngIn('hc', 'Wysokość przy licu h<sub>c</sub>')}${rngIn('lc', 'Wysięg l<sub>c</sub>')}${rngIn('b', 'Szerokość b')}
    <div class="row wide"><label>Klasy betonu</label><div>${WS.CONCRETE_CLASSES.filter(c => +c.slice(1).split('/')[0] <= 60).map(c => `<label class="chk" style="display:inline-flex;margin-right:8px"><input type="checkbox" data-oc="${c}" ${o.concretes.includes(c) ? 'checked' : ''}><span>${c}</span></label>`).join('')}</div></div>
    <div class="row wide"><label>Średnice prętów głównych</label><div>${[12, 14, 16, 20, 25, 28, 32].map(d => `<label class="chk" style="display:inline-flex;margin-right:8px"><input type="checkbox" data-od="${d}" ${o.diameters.includes(d) ? 'checked' : ''}><span>φ${d}</span></label>`).join('')}</div></div>
    <div class="row"><label>Cena stali</label><input class="txt" id="opSp" value="${String(o.steel_price).replace('.', ',')}"><span class="unit">zł/kg</span></div>
    <div class="row"><label>Maks. liczba wariantów</label><input class="txt" id="opMax" value="${o.max_variants}"><span class="unit"></span></div></div>
    <div class="dbtn" style="justify-content:flex-start"><button class="btn pri" id="opGo">${optRun ? 'Przerwij' : '▶ Uruchom optymalizację'}</button><span id="opProg" class="hint" style="margin:0"></span></div></div>
    <div class="box" id="opRes">${optResHTML()}</div></div>`;
  el.innerHTML = h; u.renderDsum();
  const save = () => { u.setDirty(); };

  u.$$('[data-ron]', el).forEach(c => c.addEventListener('change', () => { const k = c.dataset.ron, base = { hc: v.geometry.right.h_c, lc: v.geometry.right.l_c, b: v.geometry.b }[k]; o[k] = c.checked ? [Math.max(100, base - 100), base + 200, 50] : null; save(); WV.renderOpt(el); }));
  u.$$('[data-rk]', el).forEach(i => i.addEventListener('input', () => { const [k, j] = i.dataset.rk.split('.'); const x = parseFloat(i.value.replace(',', '.')); i.classList.toggle('bad', !isFinite(x)); if (isFinite(x) && o[k]) { o[k][+j] = x; save(); } }));
  u.$$('[data-oc]', el).forEach(c => c.addEventListener('change', () => { const a = o.concretes, k = c.dataset.oc; if (c.checked && !a.includes(k)) a.push(k); if (!c.checked) a.splice(a.indexOf(k), 1); save(); }));
  u.$$('[data-od]', el).forEach(c => c.addEventListener('change', () => { const a = o.diameters, k = +c.dataset.od; if (c.checked && !a.includes(k)) a.push(k); if (!c.checked) a.splice(a.indexOf(k), 1); a.sort((x, y) => x - y); save(); }));
  u.$('#opSp', el).oninput = e => { const x = parseFloat(e.target.value.replace(',', '.')); if (isFinite(x)) { o.steel_price = x; save(); } };
  u.$('#opMax', el).oninput = e => { const x = parseInt(e.target.value, 10); if (x > 0) { o.max_variants = Math.min(2000, x); save(); } };

  bindOptRes(el);
};
function optResHTML() {
  const u = U(), { esc, fmt } = u;
  if (!optRes) return '<h4>Wyniki</h4><p class="hint">Ustaw zakresy i uruchom optymalizację. Najlepszy wariant można przyjąć do projektu jako nowy wariant albo zastąpić bieżący.</p>';
  const ok = optRes.filter(o => o.feasible);
  return `<h4>Wyniki – ${optRes.length} wariantów, dopuszczalnych ${ok.length}</h4><div class="tscroll"><table class="sched opttab"><tr><th></th><th>h<sub>c</sub></th><th>h<sub>e</sub></th><th>l<sub>c</sub></th><th>b</th><th>beton</th><th>zbrojenie główne</th><th>stal [kg]</th><th>beton [m³]</th><th>koszt stali [zł]</th><th>η<sub>max</sub></th><th>wynik</th><th></th></tr>${optRes.slice(0, 60).map((o, i) => `<tr class="${o.feasible ? '' : 'nok'}"><td>${o.feasible ? '✔' : '✖'}</td><td class="n">${fmt(o.h_c, 0)}</td><td class="n">${fmt(o.h_e, 0)}</td><td class="n">${fmt(o.l_c, 0)}</td><td class="n">${fmt(o.b, 0)}</td><td>${esc(o.concrete)}</td><td>${esc(o.main)}</td><td class="n">${fmt(o.steel_kg, 1)}</td><td class="n">${fmt(o.concrete_m3, 3)}</td><td class="n">${fmt(o.steel_kg * (U().getS().meta.opt.steel_price || 0), 0)}</td><td class="n">${isFinite(o.eta_max) ? fmt(o.eta_max * 100, 0) + '%' : '∞'}</td><td title="${esc(o.reason)}">${esc(o.verdict)}</td><td>${o.feasible ? `<button class="btn sm" data-oa="${i}">Przyjmij</button>` : ''}</td></tr>`).join('')}</table></div>`;
}
function bindOptRes(el) {
  const u = U();
  u.$$('[data-oa]', el).forEach(b => b.addEventListener('click', async () => {
    const o = optRes[+b.dataset.oa], v = u.clone(o.variant); v.name = `Optymalny (${WS.OBJECTIVES[u.getS().meta.opt.objective].replace(/^Minimaln\w+ |^Najmniejsze /, '')})`;
    const asNew = await u.ask('Przyjąć wariant jako <b>nowy wariant projektu</b> (zalecane)? „Anuluj” – bez zmian.', 'Dodaj jako nowy wariant');
    if (asNew) { u.addVariant(v); u.toast('Dodano wariant optymalny.'); u.selectTab('sum'); }
  }));
}
function runOpt(el, o) {
  const u = U(), base = u.clone(u.V()), s = { objective: o.objective, h_c: o.hc, l_c: o.lc, b: o.b, concretes: o.concretes, diameters: o.diameters, steel_price: o.steel_price, max_variants: o.max_variants };
  const { list, total } = WS.optGrid(base, s); const out = []; let k = 0;
  optRun = { stop: false }; optRes = null; WV.renderOpt(el);
  const prog = () => { const p = u.$('#opProg'); if (p) p.textContent = `${k} / ${list.length}${total > list.length ? ` (ograniczono z ${total})` : ''}…`; };
  const step = () => {
    if (optRun.stop || k >= list.length) {
      optRes = WS.optSort(out); const stopped = optRun.stop; optRun = null;
      const p = u.$('#p-opt'); if (p && p.classList.contains('on')) WV.renderOpt(p); u.toast(stopped ? 'Optymalizacja przerwana.' : 'Optymalizacja zakończona.'); return;
    }
    const t0 = Date.now();
    while (k < list.length && Date.now() - t0 < 60) { const r = WS.optEvaluate(list[k], s); r.objective = WS.optObjective(r, s.objective); out.push(r); k++; }
    prog(); setTimeout(step, 0);
  };
  step();
}

  u.$$('[data-pv]', m).forEach(i => i.addEventListener('change', () => {

    } else if (f.t === 'txt') {

  <p style="font-size:12px;color:var(--ink3)">Program jest narzędziem pomocniczym. Wyniki wymagają weryfikacji przez osobę z odpowiednimi uprawnieniami budowlanymi. Lokalny model wspornika nie obejmuje sprawdzenia słupa, łożyska i elementów stalowych.</p>
  <div class="dbtn"><button class="btn pri" data-close>Zamknij</button></div>`);
}

/* ------------------------------------------------------------ start */
function init() {
  nlObs.observe(document.body, { childList: true, subtree: true });
  let saved = window.__AUTOSAVE || null;
  if (!saved) { try { saved = JSON.parse(localStorage.getItem('wspornik-autosave') || 'null'); } catch (e) { saved = null; } }
  S = defaultProject();
  if (saved && saved.state) { try { S = normalize(saved.state); filePath = saved.filePath || ''; cloudId = saved.cloudId || null; cloudName = saved.cloudName || ''; } catch (e) { S = defaultProject(); } }
  if (ART) { $('#bPrint').hidden = true; $('#bSaveAs').hidden = true; $('#bExport').hidden = true; }
  $('#projName').value = S.info.name || '';
  $('#projName').addEventListener('input', e => { S.info.name = e.target.value; dirty = true; updateTitle(); autosave(); rendered.report = false; });
  $$('.tabs button').forEach(b => b.addEventListener('click', () => { $$('.tabs button').forEach(x => x.classList.toggle('on', x === b)); $$('.pane').forEach(p => p.classList.toggle('on', p.id === 'p-' + b.dataset.tab)); renderActive(); }));
  $$('[data-act]').forEach(b => b.addEventListener('click', () => ({ new: newProject, open: openFile, save: () => saveFile(false), saveas: () => saveFile(true), cloud: openCloud, print: doPrint, exporthtml: () => window.WV.exportHTML(), about })[b.dataset.act]()));
  document.addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if (!ART && (e.key === 'F5' || (e.ctrlKey && k === 'r'))) { e.preventDefault(); return; }
    if ($('#modal').style.display === 'flex' && e.key !== 'Escape') return;
    if (e.ctrlKey && k === 's') { e.preventDefault(); saveFile(e.shiftKey); }
    else if (e.ctrlKey && k === 'o') { e.preventDefault(); openFile(); }
    else if (e.ctrlKey && k === 'n' && !ART) { e.preventDefault(); newProject(); }
    else if (e.ctrlKey && k === 'p') { e.preventDefault(); doPrint(); }
    else if (e.key === 'F2') { e.preventDefault(); U.selectTab('report'); }
    else if (e.key === 'Escape') { closeList(); cloudOpen = false; $('#modal').style.display = 'none'; }
  });
  $('#modal').addEventListener('mousedown', e => { if (e.target.id === 'modal' && !$('[data-a]', e.currentTarget)) { cloudOpen = false; e.currentTarget.style.display = 'none'; } });
  let rz = null, lastW = window.innerWidth;
  window.addEventListener('resize', () => { if (Math.abs(window.innerWidth - lastW) < 40) return; lastW = window.innerWidth; clearTimeout(rz); rz = setTimeout(() => { rendered = {}; renderActive(); }, 150); });
  renderInputs(); recalc(); renderInputs(); updateTitle(); initCapabilities();
}
Object.assign(U, {
  V, getS: () => S, setDirty: () => { dirty = true; updateTitle(); autosave(); },
  applyVariant: v => { S.variants[S.active] = normVariant(v); afterVariant(); },
  addVariant: v => { S.variants.push(normVariant(v)); S.active = S.variants.length - 1; afterVariant(); },
  selectTab: t => { const b = $(`.tabs button[data-tab="${t}"]`); if (b) b.click(); },
  projectJSON, VER, APP, DBL, normVariant,
});
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
</script>
